
[program:gpagent]
priority=50
autorestart=true
startretries=10
command=/supervisor-log-prefix.sh /gpagent-lxde.sh
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:danted]
priority=60
autorestart=true
command=/supervisor-log-prefix.sh /danted.sh
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
